short_bio: >-
  <p>
    I am an M.S. student in the Department of Computer Science and Engineering at
    <a href="https://plus.cnu.ac.kr/html/en/" target="_blank">Chungnam National University (CNU)</a>,
    where I am a member of the
    <a href="https://cnu-ants.github.io/" target="_blank">Software Analysis &amp; Testing Research Group (ANTS)</a>
    advised by <a href="https://cnu-ants.github.io/members/sunghol" target="_blank">Prof. Sungho Lee</a>.
  </p>

  <p>
    My research focuses on <b>automated software testing</b>. I have previously worked on
    analyzing <b>GitHub Actions</b> workflows, and my current research explores techniques for
    generating effective inputs for <b>fuzzing</b>.
  </p>

  <p class="mb-0">
    <b>Research interests:</b>
    <span class="badge badge-light border">Static Analysis</span>
    <span class="badge badge-light border">GitHub Actions</span>
    <span class="badge badge-light border">Automated Testing</span>
  </p>

